<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ミニ掲示板</title>
</head>
<body>
    <h1>ミニ掲示板</h1>

    <form action="/posts" method="post">
        <p>名前: <input type="text" name="name"></p>
        <p>本文:<br><textarea name="body" rows="3" cols="40"></textarea></p>
        <input type="submit" value="投稿">
    </form>
    <hr>

    {% for post in posts %}
        <p>
            <strong>{{ post.name }}</strong> ({{ post.created_at }})<br>
            {{ post.body }}
        </p>
        <hr>
    {% endfor %}
</body>
</html>
